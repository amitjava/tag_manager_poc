# domain-rules.yaml — billing domain
# Generated by /scaffold-domain · managed by /update-agent-context and /ship-feature
# NEVER edit status, superseded_by, or modified_prd manually — set by validate-knowledge

domain: billing
version: 1

rules:

  # ── Subtotal ─────────────────────────────────────────────────────────────
  - id: 2.1.1
    status: active
    plain_english: >
      The order subtotal is the sum of unit_price × quantity for every line item
      in the order. unit_price is always stored in whole cents. Fractional cents
      are impossible by schema constraint. An order with zero line items has a
      subtotal of 0. The subtotal is calculated before any discount or tax is
      applied and is never negative.
    formula: "sum(unit_price_cents * quantity) for each line_item"
    why: >
      Single calculation point prevents frontend/backend drift. All downstream
      calculations (discount cap, tax base) derive from this value.
    introduced_prd: 7
    user_story_ref: "PRD #7 Story 1"
    test_cases:
      - input: { line_items: [{unit_price_cents: 1000, quantity: 2}, {unit_price_cents: 500, quantity: 1}] }
        expected: { subtotal_cents: 2500 }
      - input: { line_items: [] }
        expected: { subtotal_cents: 0 }
      - input: { line_items: [{unit_price_cents: 999, quantity: 1}] }
        expected: { subtotal_cents: 999 }

  # ── Discount ─────────────────────────────────────────────────────────────
  - id: 2.2.1
    status: active
    plain_english: >
      A coupon discount is deducted from the subtotal before tax is calculated.
      Two coupon types exist: percent (e.g. 20% off) deducts floor(subtotal ×
      rate); fixed (e.g. $10 off) deducts the fixed amount in cents. In both
      cases the discount is capped at the subtotal — it can never make the
      taxable amount negative. If no coupon is provided, discount is 0.
    formula: >
      percent: floor(subtotal_cents * rate)
      fixed:   min(fixed_cents, subtotal_cents)
      none:    0
    why: >
      Floor on percent discount gives the customer the benefit of the doubt on
      fractional cents, consistent with tax floor behaviour (rule 2.3.1). Cap
      prevents negative taxable amounts without special-casing downstream.
    introduced_prd: 7
    user_story_ref: "PRD #7 Story 2"
    test_cases:
      - input: { subtotal_cents: 2500, coupon: {type: percent, value: 0.20} }
        expected: { discount_cents: 500 }
      - input: { subtotal_cents: 2500, coupon: {type: fixed, value_cents: 1000} }
        expected: { discount_cents: 1000 }
      - input: { subtotal_cents: 500, coupon: {type: fixed, value_cents: 1000} }
        expected: { discount_cents: 500 }
      - input: { subtotal_cents: 2500, coupon: null }
        expected: { discount_cents: 0 }

  # ── Tax ──────────────────────────────────────────────────────────────────
  - id: 2.3.1
    status: active
    plain_english: >
      Sales tax is calculated on the taxable amount, which is the subtotal minus
      the discount. The tax rate is read from the SALES_TAX_RATE environment
      variable at startup. The result is floored (not rounded) to whole cents —
      always in the customer's favour. If the taxable amount is 0, tax is 0.
    formula: "floor(taxable_amount_cents * tax_rate)  where  taxable_amount = subtotal - discount"
    why: >
      Tax on post-discount amount is legally correct and expected by customers.
      Floor matches business preference confirmed in grill-me: round down, never
      charge a partial cent. Single env-var rate keeps jurisdiction logic out of
      application code for now.
    introduced_prd: 7
    user_story_ref: "PRD #7 Story 3"
    test_cases:
      - input: { taxable_cents: 2000, tax_rate: 0.08 }
        expected: { tax_cents: 160 }
      - input: { taxable_cents: 2499, tax_rate: 0.08 }
        expected: { tax_cents: 199 }
      - input: { taxable_cents: 0, tax_rate: 0.08 }
        expected: { tax_cents: 0 }

  # ── Order Total ───────────────────────────────────────────────────────────
  - id: 2.4.1
    status: active
    plain_english: >
      The order total is the final amount charged to the customer: subtotal minus
      discount plus tax. All four values (subtotal, discount, tax, total) are
      returned in the API response so the UI can display a full breakdown. The
      total is always a non-negative whole number of cents.
    formula: "total_cents = subtotal_cents - discount_cents + tax_cents"
    why: >
      Explicit formula prevents any ambiguity about rounding order. Returning all
      four fields gives the UI and audit log everything needed without a second
      API call.
    introduced_prd: 7
    user_story_ref: "PRD #7 Story 4"
    test_cases:
      - input: { subtotal_cents: 2500, discount_cents: 500, tax_cents: 160 }
        expected: { total_cents: 2160 }
      - input: { subtotal_cents: 1000, discount_cents: 0, tax_cents: 80 }
        expected: { total_cents: 1080 }
