<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access required</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  color: #fff;
}
.card {
  background: #242424;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 40px;
  width: 320px;
  text-align: center;
}
.lock { font-size: 2rem; margin-bottom: 20px; }
h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
p { color: #888; font-size: 0.85rem; margin-bottom: 28px; }
input {
  width: 100%;
  padding: 11px 14px;
  background: #1a1a1a;
  border: 1px solid #444;
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  text-align: center;
  letter-spacing: 0.1em;
  outline: none;
  margin-bottom: 14px;
}
input:focus { border-color: #666; }
button {
  width: 100%;
  padding: 11px;
  background: #fff;
  color: #1a1a1a;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: #e0e0e0; }
.error { color: #f87171; font-size: 0.82rem; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>Access required</h1>
  <p>Enter the password to view this page.</p>
  <input type="password" id="pw" placeholder="Password" autofocus />
  <button onclick="attempt()">Continue</button>
  <div class="error" id="err">Incorrect password.</div>
</div>
<script>
const EXPECTED = "6d7e04068fa604f0ea60e7f80503e1a19205cf0df1509eacab9fed06957bb76c";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function attempt() {
  const val = document.getElementById("pw").value;
  const hash = await sha256(val);
  if (hash === EXPECTED) {
    sessionStorage.setItem("auth", "ok");
    const next = new URLSearchParams(location.search).get("next") || "knowledge-loop.html";
    location.href = decodeURIComponent(next);
  } else {
    document.getElementById("err").style.display = "block";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}

document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") attempt();
});

// Already logged in? Redirect immediately.
if (sessionStorage.getItem("auth") === "ok") {
  const next = new URLSearchParams(location.search).get("next") || "knowledge-loop.html";
  location.href = decodeURIComponent(next);
}
</script>
</body>
</html>
