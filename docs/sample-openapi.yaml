openapi: "3.1.0"
info:
  title: Billing API
  version: "1.0"
  description: >
    Order total calculation, coupon redemption, and invoice retrieval.
    All monetary values are in whole cents (integer). Never floats.

servers:
  - url: /api

paths:

  /orders/calculate:
    post:
      summary: Calculate order breakdown (dry run — no order created)
      operationId: calculateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
            example:
              line_items:
                - product_id: "prod_abc"
                  unit_price_cents: 1999
                  quantity: 2
                - product_id: "prod_xyz"
                  unit_price_cents: 499
                  quantity: 1
              coupon_code: "SUMMER20"
      responses:
        "200":
          description: Full order breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBreakdown"
              example:
                subtotal_cents: 4497
                discount_cents: 899
                tax_cents: 287
                total_cents: 3885
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/BusinessError"

  /orders:
    post:
      summary: Create order and record breakdown
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
      responses:
        "201":
          description: Order created with breakdown stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OrderBreakdown"
                  - type: object
                    properties:
                      order_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/BusinessError"

  /invoices/{order_id}:
    get:
      summary: Retrieve invoice for a completed order
      operationId: getInvoice
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Order not found or invoice not yet generated

components:

  schemas:

    LineItem:
      type: object
      required: [product_id, unit_price_cents, quantity]
      properties:
        product_id:
          type: string
        unit_price_cents:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1

    CalculateRequest:
      type: object
      required: [line_items]
      properties:
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
          minItems: 1
        coupon_code:
          type: string
          nullable: true

    OrderBreakdown:
      type: object
      required: [subtotal_cents, discount_cents, tax_cents, total_cents]
      properties:
        subtotal_cents:
          type: integer
          minimum: 0
          description: "Rule 2.1.1 — sum of unit_price_cents × quantity"
        discount_cents:
          type: integer
          minimum: 0
          description: "Rule 2.2.1 — coupon deduction, capped at subtotal"
        tax_cents:
          type: integer
          minimum: 0
          description: "Rule 2.3.1 — floor(taxable × SALES_TAX_RATE)"
        total_cents:
          type: integer
          minimum: 0
          description: "Rule 2.4.1 — subtotal − discount + tax"

    Invoice:
      type: object
      properties:
        invoice_id:
          type: string
        order_id:
          type: string
        breakdown:
          $ref: "#/components/schemas/OrderBreakdown"
        issued_at:
          type: string
          format: date-time

  responses:

    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "missing_field"
              field:
                type: string
                example: "line_items"

    BusinessError:
      description: Valid request but business rule rejected it
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [coupon_expired, coupon_invalid]
          examples:
            expired:
              value: { error: "coupon_expired" }
            invalid:
              value: { error: "coupon_invalid" }
